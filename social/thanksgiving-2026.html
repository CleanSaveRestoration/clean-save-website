<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Fraunces:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:#111;font-family:Inter,sans-serif;color:#fff;overflow:hidden;position:relative}
.bar{position:absolute;left:0;top:0;width:24px;height:100%;background:#E8186D}
.wrap{position:absolute;inset:110px 110px 100px 130px;display:flex;flex-direction:column}
.kicker{font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:#E8186D;font-size:26px}
h1{font-weight:900;font-size:128px;line-height:.92;letter-spacing:-.03em;margin-top:34px}
h1 em{font-family:Fraunces,serif;font-style:italic;font-weight:600;color:#E8186D;letter-spacing:-.01em}
p{font-size:38px;line-height:1.35;color:#d6d9dd;margin-top:54px;max-width:780px;font-weight:500}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;border-top:2px solid #333;padding-top:34px}
.brand{font-weight:900;font-size:40px;letter-spacing:-.01em}
.brand span{display:block;font-weight:500;font-size:22px;color:#9aa0a6;letter-spacing:.14em;text-transform:uppercase;margin-top:6px}
.phone{font-weight:700;font-size:30px;color:#fff}
.leaf{position:absolute;right:-80px;top:-80px;width:460px;height:460px;border-radius:50%;border:44px solid #E8186D;opacity:.16}
</style></head><body>
<div class="bar"></div><div class="leaf"></div>
<div class="wrap">
 <div class="kicker">From our crew to yours</div>
 <h1>Happy<br><em>Thanksgiving</em></h1>
 <p>Grateful for every family who trusted us with their home this year. Wishing you a warm, dry, and full table today.</p>
 <div class="foot">
  <div class="brand">Clean Save Restoration<span>Water · Fire · Mold</span></div>
  <div class="phone">(253) 553-6435</div>
 </div>
</div></body></html>
