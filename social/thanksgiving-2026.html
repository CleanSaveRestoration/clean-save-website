<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111111;--pink:#E8186D;--paper:#ffffff;--soft:#F4F6F8;--muted:#4a5058;--line:#dde1e6}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1080px;background:var(--paper);font-family:Inter,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);overflow:hidden;display:flex;flex-direction:column}
.hero{background:var(--ink);color:#fff;padding:120px 100px 110px;flex:1;display:flex;flex-direction:column;justify-content:flex-end}
.eyebrow{color:var(--pink);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:28px;margin-bottom:28px}
h1{font-weight:800;font-size:124px;line-height:1.02;letter-spacing:-.03em}
.lede{font-size:36px;line-height:1.4;color:#d6d9de;margin-top:40px;max-width:820px;font-weight:500}
.foot{padding:56px 100px 64px;border-top:12px solid var(--pink);display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;font-size:46px;letter-spacing:-.02em}
.svc{font-weight:700;font-size:22px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:8px}
.phone{font-weight:800;font-size:34px;text-align:right}
.phone span{display:block;font-weight:700;font-size:20px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:6px}
</style></head><body>
<section class="hero">
 <p class="eyebrow">From the Clean Save team</p>
 <h1>Happy Thanksgiving.</h1>
 <p class="lede">Thank you to the homeowners, adjusters and partners who trusted us with their properties this year.</p>
</section>
<footer class="foot">
 <div><div class="brand">Clean Save Restoration</div><div class="svc">Water · Fire · Mold</div></div>
 <div class="phone"><span>Call</span>(253) 553-6435</div>
</footer>
</body></html>
